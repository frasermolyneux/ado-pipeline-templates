parameters:
- name: workingDirectory
- name: backendServiceArm
- name: backendAzureRmResourceGroupName
- name: backendAzureRmStorageAccountName
- name: backendAzureRmContainerName
- name: backendAzureRmKey
- name: environmentServiceNameAzureRM
- name: varFile
- name: terraformVersion
  type: string
  default: ""

stages:
- stage: ValidateTerraform

  variables:
    commandOptions: '-var-file="${{ parameters.varFile }}"'

  jobs:
  - job: ValidateTerraform
    steps:
      - template: ../tasks/terraform-toolchain.yml
        parameters:
          terraformFolder: '${{ parameters.workingDirectory }}'
          terraformVersion: '${{ parameters.terraformVersion }}'

      - task: TerraformTaskV2@2
        displayName: 'Terraform: Init'
        inputs:
          workingDirectory: '${{ parameters.workingDirectory }}'
          commandOptions: '-lockfile=readonly'
          backendServiceArm: '${{ parameters.backendServiceArm }}'
          backendAzureRmResourceGroupName: '${{ parameters.backendAzureRmResourceGroupName }}'
          backendAzureRmStorageAccountName: '${{ parameters.backendAzureRmStorageAccountName }}'
          backendAzureRmContainerName: '${{ parameters.backendAzureRmContainerName }}'
          backendAzureRmKey: '${{ parameters.backendAzureRmKey }}'

      - task: TerraformTaskV2@2
        displayName: 'Terraform: Validate'
        inputs:
          command: validate
          workingDirectory: '${{ parameters.workingDirectory }}'
          environmentServiceNameAzureRM: '${{ parameters.environmentServiceNameAzureRM }}'

      - task: TerraformTaskV2@2
        displayName: 'Terraform: Plan'
        inputs:
          command: plan
          workingDirectory: '${{ parameters.workingDirectory }}'
          commandOptions: '$(commandOptions)'
          environmentServiceNameAzureRM: '${{ parameters.environmentServiceNameAzureRM }}'

      - template: ../tasks/terraform-execution-receipt.yml
        parameters:
          terraformFolder: '${{ parameters.workingDirectory }}'
          operation: plan