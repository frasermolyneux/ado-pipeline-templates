name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

permissions: {}

jobs:
  validate-yaml:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate YAML files
        run: |
          echo "Validating YAML syntax for all template files..."
          for file in $(find jobs stages tasks -name "*.yml"); do
            echo "Checking $file"
            python -c "import yaml; yaml.safe_load(open('$file'))"
          done
          echo "All YAML files are valid!"

      - name: Verify Terraform root-pin failure boundaries
        run: python -m unittest discover -s tests -p 'test_terraform_toolchain.py'
